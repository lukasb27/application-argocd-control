apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lukas-argo-cd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasb27/fermentation-station-argocd-control.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
